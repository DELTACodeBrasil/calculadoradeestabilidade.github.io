<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de Estabilidade</title>
    <link rel="icon" type="image/png" href="Calculadora de Estabilidade.png">
    <link rel="stylesheet" href="style.css">
    <!-- Bibliotecas externas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculadora de Estabilidade</h1>
            <p class="subtitulo">Método de Barrowman · Arthur Oliveiro</p>
        </header>

        <!-- Painel CG -->
        <section class="painel">
            <h2>Centro de Gravidade (CG)</h2>
            <div class="grid">
                <label>Massa do nariz (g)</label>
                <input id="mNariz" type="number" value="0" step="0.1">

                <label>Posição do nariz (mm)</label>
                <input id="xNariz" type="number" value="0" step="0.1">

                <label>Massa do corpo (g)</label>
                <input id="mCorpo" type="number" value="0" step="0.1">

                <label>Posição do corpo (mm)</label>
                <input id="xCorpo" type="number" value="0" step="0.1">

                <label>Massa do motor (g)</label>
                <input id="mMotor" type="number" value="0" step="0.1">

                <label>Posição do motor (mm)</label>
                <input id="xMotor" type="number" value="0" step="0.1">

                <label>Massa das empenas (g)</label>
                <input id="mEmpenas" type="number" value="0" step="0.1">

                <label>Posição das empenas (mm)</label>
                <input id="xEmpenas" type="number" value="0" step="0.1">
            </div>
        </section>

        <!-- Painel Empenas -->
        <section class="painel">
            <h2>Geometria das Empenas</h2>
            <div class="grid">
                <label>Base maior – a (mm)</label>
                <input id="a" type="number" value="0" step="0.1">

                <label>Base menor – b (mm)</label>
                <input id="b" type="number" value="0" step="0.1">

                <label>Altura – m (mm)</label>
                <input id="m" type="number" value="0" step="0.1">

                <label>Número de empenas (N)</label>
                <input id="N" type="number" value="0" step="1">

                <label>Diâmetro do foguete – d (mm)</label>
                <input id="d" type="number" value="0" step="0.1">

                <label>Início das empenas – yfo (mm)</label>
                <input id="yfo" type="number" value="0" step="0.1">

                <label>Comprimento do nariz – Ln (mm)</label>
                <input id="Ln" type="number" value="0" step="0.1">
            </div>
        </section>

        <div class="botoes">
            <button onclick="calcular()">CALCULAR ESTABILIDADE</button>
            <button onclick="gerarPDF()">EXPORTAR RELATÓRIO PDF</button>
        </div>

        <!-- Resultados -->
        <section class="painel resultado-panel">
            <h2>Relatório Técnico</h2>
            <div id="resultado">Aguardando cálculo...</div>
        </section>

        <!-- Gráfico -->
        <section class="painel">
            <h2>Comparação CG × CP</h2>
            <canvas id="grafico" width="600" height="300"></canvas>
        </section>

        <!-- Visual 2D -->
        <section class="painel">
            <h2>Representação 2D</h2>
            <canvas id="fogueteCanvas" width="800" height="200"></canvas>
            <div class="legenda">
                <span class="cg-legenda">CG (vermelho)</span> · <span class="cp-legenda">CP (azul)</span>
            </div>
        </section>

        <!-- Rodapé com imagem e direitos -->
        <footer>
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiLZWENOXOoarJ5Pk0xLf9SW9wA6DiIfJ2_cZuekSzW06kRqyOszqKNiMBkVtBSMnD4m_YJU_m9oaMpqM8gbmbkErxr9D40KBDlDQb0_YK078SyGEFbXXTI7QdDmxBwjp5ADQ2jpcZGweZzEmE3aVYC0-qBSAf4-mb1GXYvYYBS2gALoSYkWZOdWEI8TZM/s1600/%CE%94.D%CE%A3LTA%20Code.png" 
                 alt="Δ.DΣLTA CODE BRASIL" 
                 class="logo-footer"
                 onerror="this.style.display='none'">
            <p>© 2026 Δ.DΣLTA CODE BRASIL – Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
